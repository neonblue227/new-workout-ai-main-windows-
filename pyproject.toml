[project]
name = "new-workout-ai"
version = "0.1.0"
description = "Real-time squat form coach with Thai feedback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "requests>=2.31",
    "rtmlib>=0.0.13",
    "onnxruntime-gpu>=1.20.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=5.0.0,<5.10",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "huggingface-hub>=0.26.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "easydict>=1.13",
    "pyyaml>=6.0",
    "google-genai>=2.4.0",
    "python-dotenv>=1.2.2",
    "onnx2torch>=1.5.0",
    "onnx>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/analysis", "src/feedback"]
sources = ["src"]
